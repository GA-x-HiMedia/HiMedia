<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#F6F3EC" />
    <title>HiMedia Assistant</title>

    <!--
      Three roles, not three fonts picked separately.

      Instrument Serif carries the name and the person you are speaking as —
      high contrast, editorial, and it gives the interface the one piece of
      character a chat app usually lacks. It is used at large sizes only,
      which is what it is drawn for.

      Instrument Sans is its companion, designed alongside it, so the brand
      and the interface are visibly related rather than merely adjacent.

      Readex Pro is drawn for exactly this problem: Arabic and Latin by one
      hand, matched in weight and x-height, so a bilingual reply reads as one
      voice. That matters here more than in most products — the agent answers
      in whichever language it was asked in, often in the same thread.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Readex+Pro:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
